name: Update & Build Patched CachyOS Server Kernel

'on':
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if upstream has no changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kernel-update
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    accept-flake-config = false
    require-sigs = true
    sandbox = true
    substituters = https://cache.nixos.org https://linux-ms-7e79.cachix.org
    extra-substituters =
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= linux-ms-7e79.cachix.org-1:Hiw1TafR4Iz0jms+KoR4KadeOWAqqjHxAfsjqsIM7HE=
    extra-trusted-public-keys =

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: Check official sources and Nixpkgs updates
        id: check_update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OLD_STATE_HASH=$(sha256sum flake.lock kernel/sources.json | sha256sum | cut -d ' ' -f 1)

          nix flake update nixpkgs
          nix develop --command python3 -m unittest discover -s tests -v
          nix develop --command python3 scripts/update-kernel.py

          NEW_STATE_HASH=$(sha256sum flake.lock kernel/sources.json | sha256sum | cut -d ' ' -f 1)

          if [ "$OLD_STATE_HASH" = "$NEW_STATE_HASH" ] && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes detected and force_build not set. Exiting without building."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes detected (or force_build requested). Proceeding to build."
          fi

      - name: Enable KVM for the NixOS boot test
        if: steps.check_update.outputs.has_changes == 'true'
        run: sudo chmod a+rw /dev/kvm

      - name: Build kernel and modules and verify boot
        if: steps.check_update.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          nix build '.#kernel^*' .#nct6687d --no-link --print-build-logs --print-out-paths > "$RUNNER_TEMP/kernel-outputs"
          nix flake check --print-build-logs

      - name: Publish verified outputs to Cachix
        if: steps.check_update.outputs.has_changes == 'true'
        env:
          CACHIX_CACHE_NAME: ${{ secrets.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          nix develop --command cachix push "$CACHIX_CACHE_NAME" < "$RUNNER_TEMP/kernel-outputs"

      - name: Commit and push verified source and dependency pins
        if: steps.check_update.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          KERNEL_VER=$(nix eval --raw .#packages.x86_64-linux.kernel.version 2>/dev/null || echo "latest")

          git add flake.lock kernel/sources.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update cachyos server kernel ${KERNEL_VER} inputs"
            git push origin main
          else
            echo "No source or dependency changes to commit."
          fi
